<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ 세계 음식 탐험대</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange:    #FF6B35;
      --orange-l:  #FFF0EB;
      --yellow:    #FFD166;
      --green:     #06D6A0;
      --green-l:   #E8FBF5;
      --blue:      #118AB2;
      --blue-l:    #E8F4FA;
      --pink:      #EF476F;
      --purple:    #7B2D8B;
      --cream:     #FFFBF0;
      --gray-50:   #F9FAFB;
      --gray-100:  #F3F4F6;
      --gray-200:  #E5E7EB;
      --gray-400:  #9CA3AF;
      --gray-600:  #4B5563;
      --gray-800:  #1F2937;
      --white:     #FFFFFF;
      --shadow:    0 4px 20px rgba(0,0,0,.10);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.07);
      --radius:    16px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(160deg, #FFF9F0 0%, #F0FAF5 50%, #F0F5FF 100%);
      min-height: 100vh;
      color: var(--gray-800);
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, var(--orange) 0%, #FF9A3C 50%, var(--yellow) 100%);
      padding: 0 24px;
      box-shadow: 0 4px 20px rgba(255,107,53,.3);
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 860px; margin: 0 auto;
      height: 68px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand {
      font-family: 'Jua', sans-serif;
      font-size: 22px; color: var(--white);
      display: flex; align-items: center; gap: 10px;
      text-shadow: 0 2px 6px rgba(0,0,0,.15);
    }
    .brand-emoji { font-size: 28px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

    .db-status {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.25); border-radius: 20px; padding: 5px 14px;
      font-size: 12px; font-weight: 700; color: var(--white);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.5); }
    .dot.ok  { background: #4ADE80; box-shadow: 0 0 6px #4ADE80; }
    .dot.err { background: #F87171; }

    /* ── MAIN ── */
    .main { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── SEARCH CARD ── */
    .search-card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
      margin-bottom: 28px;
      text-align: center;
      border: 2px solid var(--orange-l);
    }
    .search-title {
      font-family: 'Jua', sans-serif;
      font-size: 26px; color: var(--orange);
      margin-bottom: 8px;
    }
    .search-subtitle {
      font-size: 14px; color: var(--gray-400);
      margin-bottom: 24px;
    }
    .search-row {
      display: flex; gap: 10px; max-width: 520px; margin: 0 auto;
    }
    .search-input {
      flex: 1; padding: 14px 18px;
      border: 2px solid var(--gray-200); border-radius: var(--radius);
      font-size: 16px; font-family: 'Noto Sans KR', sans-serif;
      outline: none; transition: border-color .2s, box-shadow .2s;
      background: var(--gray-50);
    }
    .search-input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(255,107,53,.12);
      background: var(--white);
    }
    .search-input::placeholder { color: var(--gray-400); }
    .btn-search {
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--orange), #FF9A3C);
      color: var(--white); border: none; border-radius: var(--radius);
      font-size: 16px; font-family: 'Jua', sans-serif;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(255,107,53,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .btn-search:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,107,53,.5);
    }
    .btn-search:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    button, .chip, .photo-item, .history-item {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Quick chips */
    .quick-chips {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px;
    }
    .chip {
      padding: 6px 14px; border-radius: 20px;
      background: var(--orange-l); color: var(--orange);
      font-size: 13px; font-weight: 700;
      cursor: pointer; border: 1.5px solid transparent;
      transition: all .15s;
    }
    .chip:hover { border-color: var(--orange); background: var(--white); }

    /* ── LOADING ── */
    .loading-area {
      text-align: center; padding: 60px 20px;
      display: none;
    }
    .loading-spinner {
      width: 60px; height: 60px; margin: 0 auto 20px;
      border: 5px solid var(--orange-l);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'Jua', sans-serif; font-size: 18px; color: var(--orange); }
    .loading-sub { font-size: 13px; color: var(--gray-400); margin-top: 8px; }

    /* ── RESULT AREA ── */
    #resultArea { display: none; }

    /* Country badge */
    .country-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--blue), #1DA1C6);
      color: var(--white); border-radius: 30px;
      padding: 8px 20px; font-family: 'Jua', sans-serif; font-size: 18px;
      box-shadow: 0 4px 14px rgba(17,138,178,.3);
      margin-bottom: 20px;
    }

    /* Food title */
    .food-title {
      font-family: 'Jua', sans-serif; font-size: 38px; color: var(--gray-800);
      margin-bottom: 6px; line-height: 1.2;
    }
    .food-subtitle { font-size: 14px; color: var(--gray-400); margin-bottom: 28px; }





    /* ── PHOTO ── */
    .photo-section { margin-bottom: 28px; }
    .photo-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 12px; margin-bottom: 10px; }
    @media (max-width: 700px) { .photo-grid { grid-template-columns: repeat(2,1fr); } }
    .photo-item {
      position:relative; border-radius:var(--radius-sm); overflow:hidden;
      aspect-ratio:1; cursor:pointer; border:3px solid transparent;
      transition:border-color .2s,transform .2s,box-shadow .2s;
      box-shadow:var(--shadow-sm); background:var(--gray-100);
      display:flex; align-items:center; justify-content:center;
    }
    .photo-item:hover { transform:scale(1.04); box-shadow:var(--shadow); }
    .photo-item.selected { border-color:var(--green); }
    .photo-item img { width:100%; height:100%; object-fit:cover; display:block; }
    .photo-overlay {
      position:absolute; inset:0; background:rgba(0,0,0,.4); opacity:0;
      display:flex; align-items:center; justify-content:center; color:white; font-size:26px; transition:opacity .2s;
    }
    .photo-item:hover .photo-overlay,
    .photo-item.selected .photo-overlay { opacity:1; }
    .photo-item.selected .photo-overlay { background:rgba(6,214,160,.45); }
    .photo-emoji-placeholder { font-size:52px; line-height:1; }
    .photo-credit { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.5); color:#fff; font-size:10px; padding:3px 6px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .photo-hint { font-size:12px; color:var(--gray-400); margin-bottom:10px; }
    .photo-source-badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:10px; margin-bottom:8px; background:var(--blue-l); color:var(--blue); }
    .btn-download { display:block; width:100%; padding:10px; border-radius:var(--radius-sm); background:var(--green-l); color:#059669; border:2px solid var(--green); font-family:'Jua',sans-serif; font-size:14px; cursor:pointer; text-align:center; transition:all .15s; margin-top:4px; }
    .btn-download:hover { background:var(--green); color:var(--white); }
    .btn-download:disabled { opacity:.4; cursor:not-allowed; }
    /* ── PHOTO MODAL ── */
    .photo-modal-backdrop { position:fixed; inset:0; z-index:200; background:rgba(0,0,0,.88); display:flex; align-items:center; justify-content:center; padding:16px; animation:fadeIn .18s ease; }
    @keyframes fadeIn { from{opacity:0}to{opacity:1} }
    .photo-modal { background:var(--white); border-radius:20px; overflow:hidden; max-width:560px; width:100%; box-shadow:0 30px 80px rgba(0,0,0,.5); animation:slideUp .2s ease; position:relative; }
    @keyframes slideUp { from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1} }
    .photo-modal-img { width:100%; max-height:55vh; object-fit:contain; background:#111; display:block; }
    .photo-modal-footer { padding:14px 18px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .photo-modal-counter { font-size:12px; color:var(--gray-400); margin-right:auto; }
    .btn-modal-nav { background:rgba(0,0,0,.55); border:none; color:#fff; width:44px; height:44px; border-radius:50%; font-size:22px; cursor:pointer; position:absolute; top:50%; transform:translateY(-50%); display:flex; align-items:center; justify-content:center; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    .btn-modal-nav.prev { left:10px; }
    .btn-modal-nav.next { right:10px; }
    .btn-modal-select { padding:9px 16px; border-radius:var(--radius-sm); background:var(--green-l); color:#059669; border:2px solid var(--green); font-family:'Jua',sans-serif; font-size:13px; cursor:pointer; transition:all .15s; }
    .btn-modal-select.active { background:var(--green); color:#fff; }
    .btn-modal-dl { padding:9px 16px; border-radius:var(--radius-sm); background:linear-gradient(135deg,var(--orange),#FF9A3C); color:#fff; border:none; font-family:'Jua',sans-serif; font-size:13px; cursor:pointer; }
    .btn-modal-close { padding:9px 14px; border-radius:var(--radius-sm); background:var(--gray-100); color:var(--gray-600); border:none; font-size:13px; cursor:pointer; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-emoji">🍽️</span>
      세계 음식 탐험대
    </div>
    <div class="db-status">
      <div class="dot" id="dbDot"></div>
      <span id="dbStatusText">연결 중…</span>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="main">

  <!-- SEARCH -->
  <div class="search-card">
    <div class="search-title">🌍 어떤 음식이 궁금한가요?</div>
    <div class="search-subtitle">세계 여러 나라의 음식 이름을 입력하면 자세히 알려드려요!</div>
    <div class="search-row">
      <input
        type="text" id="searchInput" class="search-input"
        placeholder="예: 스시, 피자, 타코..."
        maxlength="50"
      />
      <button class="btn-search" id="searchBtn" onclick="startSearch()">🔍 탐험!</button>

  <!-- ERROR -->
  <div class="error-box" id="errorBox"></div>

  <!-- LOADING -->
  <div class="loading-area" id="loadingArea">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">음식 정보를 찾는 중이에요...</div>
    <div class="loading-sub">잠깐만 기다려 주세요! 🔍</div>
  </div>

  <!-- RESULT -->
  <div id="resultArea">
    <div style="text-align:center; margin-bottom:24px;">
      <div class="country-badge" id="countryBadge">🌏 나라</div>
      <div class="food-title" id="foodTitle">음식 이름</div>
      <div class="food-subtitle" id="foodSubtitle"></div>
    </div>

    <!-- PHOTOS -->
    <div class="photo-section" id="photoSection" style="display:none">
      <div class="section-label">📸 음식 사진</div>
      <div id="photoSourceBadge"></div>
      <p class="photo-hint">🔍 사진을 클릭하면 크게 볼 수 있어요!</p>
      <div class="photo-grid" id="photoGrid"></div>
      <button class="btn-download" id="downloadBtn" onclick="downloadSelected()" disabled>
        ✅ 선택한 사진 다운로드
      </button>
    </div>

    <div class="section-divider" id="photoDivider" style="display:none"></div>

    <!-- INFO CARDS -->
    <div class="section-label">📖 음식 정보</div>
    <div class="info-grid" id="infoGrid"></div>
  </div>

  <!-- HISTORY -->
  <div class="history-card">
    <div class="history-title">🕒 검색했던 음식들</div>
    <div class="history-list" id="historyList">
      <span class="history-empty">아직 검색한 음식이 없어요.</span>
    </div>
  </div>

</main>

<div id="photoModal" style="display:none"></div>
<div id="toast"></div>

<script>
/* ════════════════════════════════════════
   SUPABASE  (원본 API 키 그대로 사용)
════════════════════════════════════════ */
const SUPABASE_URL  = "https://pqjuvuflinnrpemqcafl.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxanV2dWZsaW5ucnBlbXFjYWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NzAzMjQsImV4cCI6MjA5NDA0NjMyNH0.E4sJv1gM9TbWG-2o90aH8wJXZMLRY_uLQ9fgWARX1Ro";
const SB_HEADS = {
  "Content-Type":  "application/json",
  "apikey":        SUPABASE_ANON,
  "Authorization": "Bearer " + SUPABASE_ANON,
  "Prefer":        "return=representation"
};

async function sbGet(table, q = "") {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + table + q, { headers: SB_HEADS });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpsert(table, body) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + table, {
    method: "POST",
    headers: { ...SB_HEADS, "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ════════════════════════════════════════
   GEMINI API  (Supabase settings 테이블에서 키 자동 로드)
════════════════════════════════════════ */
let GEMINI_API_KEY = "";
// 2.5-flash 먼저 시도, 실패 시 안정 모델로 순차 fallback
const GEMINI_MODELS = [
  "gemini-2.5-flash",
  "gemini-2.0-flash",
  "gemini-1.5-flash"
];

function sleep(ms) { return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

async function loadGeminiKey() {
  // 5초 타임아웃 — 어떤 상황에서도 반드시 완료됨
  var done = false;
  var timer = setTimeout(function() {
    if (!done) { done = true; updateDbStatus("err"); }
  }, 5000);
  try {
    var rows = await sbGet("settings", "?key=eq.gemini_api_key");
    if (rows && rows.length > 0 && rows[0].value) {
      GEMINI_API_KEY = rows[0].value;
    }
    if (!done) { done = true; clearTimeout(timer); updateDbStatus("ok"); }
  } catch(e) {
    console.error("[DB] 연결 실패:", e.message || e);
    if (!done) { done = true; clearTimeout(timer); updateDbStatus("err"); }
  }
}

async function callGemini(prompt) {
  if (!GEMINI_API_KEY) throw new Error("Gemini API 키가 없습니다. Supabase settings 테이블을 확인하세요.");
  const payload = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.3 }
  };
  var lastError = "";
  for (var mi = 0; mi < GEMINI_MODELS.length; mi++) {
    var model = GEMINI_MODELS[mi];
    var apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + GEMINI_API_KEY;
    try {
      var res = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.status === 404 || res.status === 503) {
        lastError = model + " 사용 불가 (" + res.status + ")";
        await sleep(300);
        continue;
      }
      var data = await res.json();
      if (!res.ok) throw new Error(data && data.error ? data.error.message : res.statusText);
      var text = data && data.candidates && data.candidates[0] &&
                 data.candidates[0].content && data.candidates[0].content.parts &&
                 data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
      if (!text) throw new Error("응답 텍스트 없음");
      return text;
    } catch(err) {
      lastError = err.message || String(err);
      if (lastError.indexOf("API key") >= 0) throw err;
      await sleep(300);
    }
  }
  throw new Error("Gemini 응답 실패: " + lastError);
}




/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
let searchHistory = [];
let lastFoodName = "";
let selectedPhotoUrl = null;
let currentImages = [];
let modalIndex = 0;

/* ════════════════════════════════════════
   SEARCH FLOW
════════════════════════════════════════ */
function quickSearch(name) {
  document.getElementById('searchInput').value = name;
  startSearch();
}

async function startSearch() {
  const input = document.getElementById('searchInput');
  const foodName = input.value.trim();
  if (!foodName) { toast("음식 이름을 입력해 주세요! 🍴"); return; }

  setLoading(true, "음식 정보를 찾는 중이에요...");
  hideResult();
  hideError();

  lastFoodName = foodName;

  try {
    // 1. Gemini로 음식 정보 가져오기
    setLoading(true, "AI가 정보를 정리하는 중이에요...");
    const info = await fetchFoodInfo(foodName);

    // 2. 화면 표시
    renderResult(foodName, info);

    // 3. 이미지 검색 (비동기 — 정보 카드 먼저 보여주고 사진은 뒤에)
    setLoading(false);
    getFoodImages(foodName).then(function(result) {
      renderPhotos(foodName, result);
    }).catch(function(e) { console.warn('[사진]', e); });

    // 4. Supabase에 검색 기록 저장 (실패해도 무시)
    saveSearchHistory(foodName, info.country || "").catch(() => {});

    // 5. 검색 기록 UI 업데이트
    addToLocalHistory(foodName);

  } catch(e) {
    showError("앗! 오류가 생겼어요 😢<br>잠시 후 다시 시도해 주세요.<br><small>" + escHtml(e.message) + "</small>");
  } finally {
    setLoading(false);
  }
}


/* ════════════════════════════════════════
   이미지 검색 — TheMealDB → Open Food Facts → 이모지
   키 없음, 음식 사진만, 성인 콘텐츠 걱정 없음
════════════════════════════════════════ */

async function getFoodImages(foodName) {
  // Gemini로 영어 이름 변환
  var queryEn = foodName;
  try {
    var en = await callGemini('"' + foodName + '"의 영어 이름을 단어 1~3개로만 답하세요. 영어 단어만.');
    queryEn = en.trim().replace(/['"`\n\r.]/g, '').trim() || foodName;
  } catch(e) {}

  // 1순위: TheMealDB (음식 레시피 DB — 음식 사진만 있음)
  try {
    var r1 = await fetch('https://www.themealdb.com/api/json/v1/1/search.php?s=' + encodeURIComponent(queryEn));
    var d1 = await r1.json();
    if (d1.meals && d1.meals.length > 0) {
      var imgs = [];
      d1.meals.slice(0, 4).forEach(function(m) {
        if (m.strMealThumb) imgs.push({ url: m.strMealThumb, download: m.strMealThumb, credit: 'TheMealDB' });
      });
      if (imgs.length > 0) return { images: imgs, source: 'TheMealDB' };
    }
  } catch(e) { console.warn('[TheMealDB]', e.message); }

  // 2순위: Open Food Facts (식품 DB — 식품 사진만)
  try {
    var r2 = await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_terms='
      + encodeURIComponent(queryEn) + '&search_simple=1&action=process&json=1&page_size=6');
    var d2 = await r2.json();
    if (d2.products && d2.products.length > 0) {
      var imgs2 = [];
      d2.products.forEach(function(p) {
        if (p.image_url && imgs2.length < 4) {
          imgs2.push({ url: p.image_url, download: p.image_url, credit: 'Open Food Facts' });
        }
      });
      if (imgs2.length > 0) return { images: imgs2, source: 'Open Food Facts' };
    }
  } catch(e) { console.warn('[OpenFoodFacts]', e.message); }

  // 3순위: 이모지 placeholder
  return {
    images: ['🍽️','🥘','🍴','🌍'].map(function(em) {
      return { url: null, download: null, emoji: em, credit: '' };
    }),

}

function renderPhotos(foodName, result) {

      item.innerHTML =
        '<img src="' + img.url + '" alt="' + escHtml(foodName) + ' 사진" loading="lazy"'
        + ' onerror="this.parentElement.querySelector('.photo-emoji-placeholder')&&(this.style.display='none')">'
        + '<div class="photo-overlay">🔍</div>'

/* ── 다운로드 ── */
function selectPhoto(url) {
  selectedPhotoUrl = url;
  document.getElementById('downloadBtn').disabled = false;
  document.querySelectorAll('.photo-item').forEach(function(el) {
    el.classList.toggle('selected', el.dataset.dlurl === url);
  });
}
function downloadSelected() { if (selectedPhotoUrl) doDownload(selectedPhotoUrl); }
async function doDownload(url) {
  try {
    var res = await fetch(url);
    var blob = await res.blob();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = lastFoodName + '_사진.jpg'; a.click();
    toast('✅ 다운로드 시작!');
  } catch(e) {
    var a = document.createElement('a');
    a.href = url; a.target = '_blank'; a.click();
    toast('🔗 새 탭에서 열려요. 길게 눌러 저장하세요!');
  }
}

/* ── 모달 ── */
function openModal(idx) {
  modalIndex = idx; renderModal();
  document.getElementById('photoModal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function closeModal() {
  document.getElementById('photoModal').style.display = 'none';
  document.body.style.overflow = '';
}
function renderModal() {
  var img = currentImages[modalIndex];
  if (!img || !img.url) return;
  var dlUrl = img.download || img.url;
  var isSel = selectedPhotoUrl === dlUrl;
  var validTotal = currentImages.filter(function(x){return x.url;}).length;
  document.getElementById('photoModal').innerHTML =
    '<div class="photo-modal-backdrop" onclick="if(event.target===this)closeModal()" style="position:relative">'
    + '<div class="photo-modal">'
    + '<img class="photo-modal-img" src="' + img.url + '" alt="사진">'
    + (validTotal > 1
        ? '<button class="btn-modal-nav prev" onclick="shiftModal(-1)">&#8249;</button>'
          + '<button class="btn-modal-nav next" onclick="shiftModal(1)">&#8250;</button>'
        : '')
    + '<div class="photo-modal-footer">'
    + '<span class="photo-modal-counter">' + (modalIndex+1) + ' / ' + currentImages.length
    + (img.credit ? ' · 📷 ' + escHtml(img.credit) : '') + '</span>'
    + '<button class="btn-modal-select ' + (isSel?'active':'') + '" onclick="selectPhotoModal('' + dlUrl + '')">'
    + (isSel ? '✅ 선택됨' : '☑️ 선택') + '</button>'
    + '<button class="btn-modal-dl" onclick="doDownload('' + dlUrl + '')">⬇️ 다운로드</button>'
    + '<button class="btn-modal-close" onclick="closeModal()">✕</button>'
    + '</div></div></div>';
}
function selectPhotoModal(url) {
  selectedPhotoUrl = url;
  document.getElementById('downloadBtn').disabled = false;
  document.querySelectorAll('.photo-item').forEach(function(el,i){
    el.classList.toggle('selected', i === modalIndex);
    el.dataset.dlurl = currentImages[i] && currentImages[i].download || '';
  });
  renderModal();
  toast('✅ 사진이 선택됐어요!');
}
function shiftModal(dir) {
  var valids = currentImages.map(function(x,i){return x.url?i:-1;}).filter(function(i){return i>=0;});
  var cur = valids.indexOf(modalIndex);
  modalIndex = valids[(cur+dir+valids.length)%valids.length];
  renderModal();
}
document.addEventListener('keydown', function(e) {
  if (document.getElementById('photoModal').style.display==='none') return;
  if (e.key==='Escape') closeModal();
  if (e.key==='ArrowLeft')  shiftModal(-1);
  if (e.key==='ArrowRight') shiftModal(1);
});

해당 항목에 설명할 내용이 없으면 null로 두세요.
반드시 JSON만 응답하고, 마크다운 코드블록 없이 순수 JSON만 출력하세요.

{

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "✅ 복사됨!";
    btn.classList.add('copied');
    toast("복사되었어요! 📋");
    setTimeout(() => {
      btn.textContent = "📋 복사";
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = "✅ 복사됨!"; btn.classList.add('copied');
    toast("복사되었어요! 📋");
    setTimeout(() => { btn.textContent = "📋 복사"; btn.classList.remove('copied'); }, 2000);
  });
}

  {e:"🍜", n:"라멘"}, {e:"🍱", n:"덮밥"}, {e:"🌯", n:"랩"}, {e:"🥪", n:"바게트샌드위치"}
];

function renderQuickChips() {
  var el = document.getElementById('quickChips');
  if (!el) return;
  // 검색 기록에 있는 음식 제외하고 섞기
  var pool = ALL_FOODS.filter(function(f) { return searchHistory.indexOf(f.n) < 0; });
  if (pool.length < 8) pool = ALL_FOODS.slice(); // 다 검색했으면 전체 재사용
  // Fisher-Yates 셔플 후 8개 선택
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var picks = pool.slice(0, 8);
  el.innerHTML = '';
  picks.forEach(function(f) {
    var span = document.createElement('span');
    span.className = 'chip';
    span.textContent = f.e + ' ' + f.n;
    span.addEventListener('click', function() { quickSearch(f.n); });
    el.appendChild(span);
  });
}

function setLoading(show, text = "") {

  document.getElementById('searchBtn').disabled = show;
  if (text) document.getElementById('loadingText').textContent = text;

function hideResult()  { document.getElementById('resultArea').style.display = 'none'; }

function showError(msg){ const e = document.getElementById('errorBox'); e.innerHTML = msg; e.style.display='block'; }

function updateDbStatus(state) {
  var dot  = document.getElementById('dbDot');
  var text = document.getElementById('dbStatusText');
  if (!dot || !text) return;
  if (state === 'ok')         { dot.className = 'dot ok';  text.textContent = 'DB 연결됨'; }
  else if (state === 'err')   { dot.className = 'dot err'; text.textContent = 'DB 오류'; }
  else if (state === 'connecting') { dot.className = 'dot'; text.textContent = '연결 중…'; }
  else                        { dot.className = 'dot'; text.textContent = '연결 중…'; }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  // 인라인 onclick에서 안전하게 쓸 수 있도록 특수문자 제거
  return String(s)
    .replace(/\\/g, '')
    .replace(/'/g, '&#39;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, ' ')
    .replace(/\r/g, '');
}

function toast(msg, d = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), d);
}

/* ════════════════════════════════════════
   INIT  —  window.onload 사용 (body 하단 스크립트에서 DOMContentLoaded는
            이미 지나간 경우가 있어 콜백이 실행 안 될 수 있음)
════════════════════════════════════════ */
async function appInit() {
  updateDbStatus("connecting");
  try { await loadGeminiKey(); }   catch(e) { updateDbStatus("err"); }
  var inp = document.getElementById("searchInput");
  if (inp) inp.addEventListener("keydown", function(e){ if(e.key==="Enter") startSearch(); });
  renderHistory();
  renderQuickChips();
}
if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", appInit);
} else {
  appInit();
}
