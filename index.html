<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍽️ 세계 음식 탐험대</title>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange:    #FF6B35;
      --orange-l:  #FFF0EB;
      --yellow:    #FFD166;
      --green:     #06D6A0;
      --green-l:   #E8FBF5;
      --blue:      #118AB2;
      --blue-l:    #E8F4FA;
      --pink:      #EF476F;
      --purple:    #7B2D8B;
      --cream:     #FFFBF0;
      --gray-50:   #F9FAFB;
      --gray-100:  #F3F4F6;
      --gray-200:  #E5E7EB;
      --gray-400:  #9CA3AF;
      --gray-600:  #4B5563;
      --gray-800:  #1F2937;
      --white:     #FFFFFF;
      --shadow:    0 4px 20px rgba(0,0,0,.10);
      --shadow-sm: 0 2px 8px rgba(0,0,0,.07);
      --radius:    16px;
      --radius-sm: 10px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(160deg, #FFF9F0 0%, #F0FAF5 50%, #F0F5FF 100%);
      min-height: 100vh;
      color: var(--gray-800);
    }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(135deg, var(--orange) 0%, #FF9A3C 50%, var(--yellow) 100%);
      padding: 0 24px;
      box-shadow: 0 4px 20px rgba(255,107,53,.3);
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 860px; margin: 0 auto;
      height: 68px; display: flex; align-items: center; justify-content: space-between;
    }
    .brand {
      font-family: 'Jua', sans-serif;
      font-size: 22px; color: var(--white);
      display: flex; align-items: center; gap: 10px;
      text-shadow: 0 2px 6px rgba(0,0,0,.15);
    }
    .brand-emoji { font-size: 28px; animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }

    .db-status {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.25); border-radius: 20px; padding: 5px 14px;
      font-size: 12px; font-weight: 700; color: var(--white);
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.5); }
    .dot.ok  { background: #4ADE80; box-shadow: 0 0 6px #4ADE80; }
    .dot.err { background: #F87171; }

    /* ── MAIN ── */
    .main { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }

    /* ── SEARCH CARD ── */
    .search-card {
      background: var(--white);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 32px 28px 28px;
      margin-bottom: 28px;
      text-align: center;
      border: 2px solid var(--orange-l);
    }
    .search-title {
      font-family: 'Jua', sans-serif;
      font-size: 26px; color: var(--orange);
      margin-bottom: 8px;
    }
    .search-subtitle {
      font-size: 14px; color: var(--gray-400);
      margin-bottom: 24px;
    }
    .search-row {
      display: flex; gap: 10px; max-width: 520px; margin: 0 auto;
    }
    .search-input {
      flex: 1; padding: 14px 18px;
      border: 2px solid var(--gray-200); border-radius: var(--radius);
      font-size: 16px; font-family: 'Noto Sans KR', sans-serif;
      outline: none; transition: border-color .2s, box-shadow .2s;
      background: var(--gray-50);
    }
    .search-input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(255,107,53,.12);
      background: var(--white);
    }
    .search-input::placeholder { color: var(--gray-400); }
    .btn-search {
      padding: 14px 24px;
      background: linear-gradient(135deg, var(--orange), #FF9A3C);
      color: var(--white); border: none; border-radius: var(--radius);
      font-size: 16px; font-family: 'Jua', sans-serif;
      cursor: pointer; white-space: nowrap;
      box-shadow: 0 4px 16px rgba(255,107,53,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .btn-search:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,107,53,.5);
    }
    .btn-search:disabled { opacity: .5; cursor: not-allowed; transform: none; }
    button, .chip, .photo-item, .history-item {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    /* Quick chips */
    .quick-chips {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px;
    }
    .chip {
      padding: 6px 14px; border-radius: 20px;
      background: var(--orange-l); color: var(--orange);
      font-size: 13px; font-weight: 700;
      cursor: pointer; border: 1.5px solid transparent;
      transition: all .15s;
    }
    .chip:hover { border-color: var(--orange); background: var(--white); }

    /* ── LOADING ── */
    .loading-area {
      text-align: center; padding: 60px 20px;
      display: none;
    }
    .loading-spinner {
      width: 60px; height: 60px; margin: 0 auto 20px;
      border: 5px solid var(--orange-l);
      border-top-color: var(--orange);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: 'Jua', sans-serif; font-size: 18px; color: var(--orange); }
    .loading-sub { font-size: 13px; color: var(--gray-400); margin-top: 8px; }

    /* ── RESULT AREA ── */
    #resultArea { display: none; }

    /* Country badge */
    .country-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: linear-gradient(135deg, var(--blue), #1DA1C6);
      color: var(--white); border-radius: 30px;
      padding: 8px 20px; font-family: 'Jua', sans-serif; font-size: 18px;
      box-shadow: 0 4px 14px rgba(17,138,178,.3);
      margin-bottom: 20px;
    }

    /* Food title */
    .food-title {
      font-family: 'Jua', sans-serif; font-size: 38px; color: var(--gray-800);
      margin-bottom: 6px; line-height: 1.2;
    }
    .food-subtitle { font-size: 14px; color: var(--gray-400); margin-bottom: 28px; }

    /* ── PHOTO GRID ── */
    .section-label {
      font-family: 'Jua', sans-serif; font-size: 20px;
      color: var(--gray-800); margin-bottom: 14px;
      display: flex; align-items: center; gap: 8px;
    }
    .photo-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      margin-bottom: 32px;
    }
    @media (max-width: 700px) { .photo-grid { grid-template-columns: repeat(2,1fr); } }
    @media (max-width: 480px) { .photo-grid { grid-template-columns: repeat(2,1fr); } }

    .photo-item {
      position: relative; border-radius: var(--radius-sm); overflow: hidden;
      aspect-ratio: 1; cursor: pointer;
      border: 3px solid transparent;
      transition: border-color .2s, transform .2s, box-shadow .2s;
      box-shadow: var(--shadow-sm);
    }
    .photo-item:hover { transform: scale(1.04); box-shadow: var(--shadow); }
    .photo-item.selected { border-color: var(--green); box-shadow: 0 0 0 3px var(--green); }
    .photo-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,.45); opacity: 0;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .2s; color: white; font-size: 28px;
    }
    .photo-item .photo-overlay { opacity: 0.15; } /* 터치 기기: 항상 살짝 보임 */
    .photo-item:hover .photo-overlay { opacity: 1; }
    .photo-item.selected .photo-overlay { opacity: 1; background: rgba(6,214,160,.5); }

    .photo-loading {
      aspect-ratio: 1; border-radius: var(--radius-sm);
      background: linear-gradient(90deg, var(--gray-100) 25%, var(--gray-50) 50%, var(--gray-100) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .photo-download-btn {
      display: block; width: 100%; margin-top: 12px;
      padding: 10px; border-radius: var(--radius-sm);
      background: var(--green-l); color: var(--green);
      border: 2px solid var(--green); font-family: 'Jua', sans-serif;
      font-size: 14px; cursor: pointer; text-align: center;
      transition: background .15s;
    }
    .photo-download-btn:hover { background: var(--green); color: var(--white); }
    .photo-download-btn:disabled { opacity: .4; cursor: not-allowed; }

    /* ── PHOTO HINT ── */
    .photo-hint {
      font-size: 12px; color: var(--gray-400); text-align: center;
      margin-top: 8px; margin-bottom: -4px;
    }

    /* ── PHOTO MODAL ── */
    .photo-modal-backdrop {
      position: fixed; inset: 0; z-index: 200;
      background: rgba(0,0,0,.85);
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }

    .photo-modal {
      background: var(--white); border-radius: 20px;
      max-width: 600px; width: 100%;
      overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,.5);
      animation: slideUp .22s ease;
    }
    @keyframes slideUp { from { transform:translateY(30px); opacity:0 } to { transform:translateY(0); opacity:1 } }

    .photo-modal-img-wrap {
      width: 100%; background: #111;
      display: flex; align-items: center; justify-content: center;
      min-height: 280px; max-height: 60vh; overflow: hidden;
    }
    .photo-modal-img-wrap img {
      width: 100%; height: 100%; object-fit: contain; display: block;
      max-height: 60vh;
    }

    .photo-modal-nav {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255,255,255,.18); border: none;
      color: white; font-size: 28px; cursor: pointer;
      width: 56px; height: 56px; border-radius: 50%;   /* 터치 영역 확대 */
      display: flex; align-items: center; justify-content: center;
      transition: background .15s; backdrop-filter: blur(4px);
      -webkit-tap-highlight-color: transparent;          /* 안드로이드 탭 하이라이트 제거 */
      touch-action: manipulation;
    }
    .photo-modal-nav:hover { background: rgba(255,255,255,.35); }
    .photo-modal-nav.prev { left: 12px; }
    .photo-modal-nav.next { right: 12px; }

    .photo-modal-footer {
      padding: 16px 20px;
      display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    }
    .photo-modal-counter {
      font-size: 13px; color: var(--gray-400); font-weight: 600; margin-right: auto;
    }
    .btn-modal-select {
      padding: 10px 20px; border-radius: var(--radius-sm);
      background: var(--green-l); color: #059669;
      border: 2px solid var(--green); font-family: 'Jua', sans-serif;
      font-size: 14px; cursor: pointer; transition: all .15s;
    }
    .btn-modal-select:hover, .btn-modal-select.active {
      background: var(--green); color: var(--white);
    }
    .btn-modal-download {
      padding: 10px 20px; border-radius: var(--radius-sm);
      background: linear-gradient(135deg, var(--orange), #FF9A3C);
      color: var(--white); border: none;
      font-family: 'Jua', sans-serif; font-size: 14px;
      cursor: pointer; box-shadow: 0 3px 10px rgba(255,107,53,.35);
      transition: opacity .15s;
    }
    .btn-modal-download:hover { opacity: .85; }
    .btn-modal-close {
      padding: 10px 16px; border-radius: var(--radius-sm);
      background: var(--gray-100); color: var(--gray-600);
      border: none; font-size: 14px; cursor: pointer;
      transition: background .15s;
    }
    .btn-modal-close:hover { background: var(--gray-200); }

    /* ── INFO CARDS ── */
    .info-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
    }
    @media (max-width: 700px) { .info-grid { grid-template-columns: 1fr; } }

    .info-card {
      background: var(--white); border-radius: var(--radius);
      padding: 18px 20px; box-shadow: var(--shadow-sm);
      border: 2px solid var(--gray-100);
      transition: border-color .2s, box-shadow .2s;
      position: relative;
    }
    .info-card:hover { border-color: var(--gray-200); box-shadow: var(--shadow); }

    .info-card.full-width { grid-column: 1 / -1; }

    .info-card-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .info-card-label {
      display: flex; align-items: center; gap: 7px;
      font-family: 'Jua', sans-serif; font-size: 16px;
    }
    .label-icon {
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .info-card-text {
      font-size: 14px; line-height: 1.8; color: var(--gray-600);
    }

    /* Color variants */
    .card-orange .label-icon { background: var(--orange-l); }
    .card-orange .info-card-label { color: var(--orange); }
    .card-blue   .label-icon { background: var(--blue-l);   }
    .card-blue   .info-card-label { color: var(--blue); }
    .card-green  .label-icon { background: var(--green-l);  }
    .card-green  .info-card-label { color: #059669; }
    .card-pink   .label-icon { background: #FFF0F5; }
    .card-pink   .info-card-label { color: var(--pink); }
    .card-purple .label-icon { background: #F5EEFF; }
    .card-purple .info-card-label { color: var(--purple); }
    .card-yellow .label-icon { background: #FFFBEB; }
    .card-yellow .info-card-label { color: #B45309; }

    /* Copy btn */
    .btn-copy {
      padding: 5px 12px; border-radius: 8px; border: 1.5px solid var(--gray-200);
      background: var(--gray-50); color: var(--gray-600);
      font-size: 12px; font-family: 'Noto Sans KR', sans-serif; font-weight: 700;
      cursor: pointer; transition: all .15s; flex-shrink: 0;
    }
    .btn-copy:hover { background: var(--green-l); border-color: var(--green); color: #059669; }
    .btn-copy.copied { background: var(--green-l); border-color: var(--green); color: #059669; }

    /* ── HISTORY CARD ── */
    .history-card {
      background: var(--white); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); padding: 20px 24px;
      border: 2px solid var(--gray-100); margin-top: 32px;
    }
    .history-title {
      font-family: 'Jua', sans-serif; font-size: 18px;
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
    }
    .history-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .history-item {
      padding: 7px 14px; border-radius: 20px;
      background: var(--gray-50); border: 1.5px solid var(--gray-200);
      font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .history-item:hover { background: var(--orange-l); border-color: var(--orange); color: var(--orange); }
    .history-empty { font-size: 13px; color: var(--gray-400); }

    /* ── TOAST ── */
    #toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--gray-800); color: var(--white);
      padding: 12px 24px; border-radius: 30px;
      font-size: 13px; font-weight: 700;
      box-shadow: 0 10px 40px rgba(0,0,0,.2);
      transition: transform .3s, opacity .3s; opacity: 0;
      pointer-events: none; z-index: 999; white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── ERROR ── */
    .error-box {
      background: #FFF1F2; border: 2px solid #FECDD3;
      border-radius: var(--radius); padding: 20px 24px;
      color: #9F1239; font-size: 14px; display: none;
    }

    /* ── DIVIDER ── */
    .section-divider { height: 2px; background: var(--gray-100); border-radius: 2px; margin: 28px 0; }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-emoji">🍽️</span>
      세계 음식 탐험대
    </div>
    <div class="db-status">
      <div class="dot" id="dbDot"></div>
      <span id="dbStatusText">연결 중…</span>
    </div>
  </div>
</header>

<!-- MAIN -->
<main class="main">

  <!-- SEARCH -->
  <div class="search-card">
    <div class="search-title">🌍 어떤 음식이 궁금한가요?</div>
    <div class="search-subtitle">세계 여러 나라의 음식 이름을 입력하면 자세히 알려드려요!</div>
    <div class="search-row">
      <input
        type="text" id="searchInput" class="search-input"
        placeholder="예: 스시, 피자, 타코..."
        maxlength="50"
      />
      <button class="btn-search" id="searchBtn" onclick="startSearch()">🔍 탐험!</button>
    </div>
    <div class="quick-chips" id="quickChips"></div>
  </div>

  <!-- ERROR -->
  <div class="error-box" id="errorBox"></div>

  <!-- LOADING -->
  <div class="loading-area" id="loadingArea">
    <div class="loading-spinner"></div>
    <div class="loading-text" id="loadingText">음식 정보를 찾는 중이에요...</div>
    <div class="loading-sub">잠깐만 기다려 주세요! 🔍</div>
  </div>

  <!-- RESULT -->
  <div id="resultArea">
    <div style="text-align:center; margin-bottom:24px;">
      <div class="country-badge" id="countryBadge">🌏 나라</div>
      <div class="food-title" id="foodTitle">음식 이름</div>
      <div class="food-subtitle" id="foodSubtitle"></div>
    </div>

    <!-- PHOTOS -->
    <div class="section-label">📸 사진 (클릭해서 선택, 선택 후 다운로드)</div>
    <div class="photo-grid" id="photoGrid"></div>
    <p class="photo-hint">🔍 사진을 클릭하면 크게 볼 수 있어요!</p>
    <button class="photo-download-btn" id="downloadBtn" onclick="downloadSelected()" disabled>
      ✅ 선택한 사진 다운로드
    </button>

    <div class="section-divider"></div>

    <!-- INFO CARDS -->
    <div class="section-label">📖 음식 정보</div>
    <div class="info-grid" id="infoGrid"></div>
  </div>

  <!-- HISTORY -->
  <div class="history-card">
    <div class="history-title">🕒 검색했던 음식들</div>
    <div class="history-list" id="historyList">
      <span class="history-empty">아직 검색한 음식이 없어요.</span>
    </div>
  </div>

</main>

<!-- PHOTO MODAL -->
<div id="photoModal" style="display:none"></div>
<div id="toast"></div>

<script>
/* ════════════════════════════════════════
   SUPABASE  (원본 API 키 그대로 사용)
════════════════════════════════════════ */
const SUPABASE_URL  = "https://pqjuvuflinnrpemqcafl.supabase.co";
const SUPABASE_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBxanV2dWZsaW5ucnBlbXFjYWZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0NzAzMjQsImV4cCI6MjA5NDA0NjMyNH0.E4sJv1gM9TbWG-2o90aH8wJXZMLRY_uLQ9fgWARX1Ro";
const SB_HEADS = {
  "Content-Type":  "application/json",
  "apikey":        SUPABASE_ANON,
  "Authorization": "Bearer " + SUPABASE_ANON,
  "Prefer":        "return=representation"
};

async function sbGet(table, q = "") {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + table + q, { headers: SB_HEADS });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sbUpsert(table, body) {
  const r = await fetch(SUPABASE_URL + "/rest/v1/" + table, {
    method: "POST",
    headers: { ...SB_HEADS, "Prefer": "resolution=merge-duplicates,return=representation" },
    body: JSON.stringify(body)
  });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

/* ════════════════════════════════════════
   GEMINI API  (Supabase settings 테이블에서 키 자동 로드)
════════════════════════════════════════ */
let GEMINI_API_KEY = "";
// 2.5-flash 먼저 시도, 실패 시 안정 모델로 순차 fallback
const GEMINI_MODELS = [
  "gemini-2.5-flash",
  "gemini-2.0-flash",
  "gemini-1.5-flash"
];

function sleep(ms) { return new Promise(function(resolve){ setTimeout(resolve, ms); }); }

async function loadGeminiKey() {
  // file:// 프로토콜에서는 외부 API 호출이 차단됨
  if (window.location.protocol === 'file:') {
    updateDbStatus("err");
    var errBox = document.getElementById('errorBox');
    if (errBox) {
      errBox.innerHTML = '⚠️ <b>로컬 파일로 열면 외부 연결이 차단돼요!</b><br>'
        + 'VS Code의 <b>Live Server</b> 확장 프로그램이나 '
        + '<b>GitHub Pages</b>에 올려서 열어주세요.<br>'
        + '<small>Chrome 주소창이 <code>file://</code>로 시작하면 이 오류가 발생해요.</small>';
      errBox.style.display = 'block';
    }
    return false;
  }

async function callGemini(prompt) {
  if (!GEMINI_API_KEY) throw new Error("Gemini API 키가 없습니다. Supabase settings 테이블을 확인하세요.");
  const payload = {
    contents: [{ parts: [{ text: prompt }] }],
    generationConfig: { temperature: 0.3 }
  };
  var lastError = "";
  for (var mi = 0; mi < GEMINI_MODELS.length; mi++) {
    var model = GEMINI_MODELS[mi];
    var apiUrl = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + GEMINI_API_KEY;
    try {
      var res = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
      if (res.status === 404 || res.status === 503) {
        lastError = model + " 사용 불가 (" + res.status + ")";
        await sleep(300);
        continue;
      }
      var data = await res.json();
      if (!res.ok) throw new Error(data && data.error ? data.error.message : res.statusText);
      var text = data && data.candidates && data.candidates[0] &&
                 data.candidates[0].content && data.candidates[0].content.parts &&
                 data.candidates[0].content.parts[0] && data.candidates[0].content.parts[0].text;
      if (!text) throw new Error("응답 텍스트 없음");
      return text;
    } catch(err) {
      lastError = err.message || String(err);
      if (lastError.indexOf("API key") >= 0) throw err;
      await sleep(300);
    }
  }
  throw new Error("Gemini 응답 실패: " + lastError);
}

function closePhotoModal() {

function renderModal() {
  const img = currentImages[modalIndex];
  if (!img || !img.url) return;
  const downloadUrl = img.download || img.url;
  const isSelected = selectedPhotoUrl === downloadUrl;
  const total = currentImages.filter(i => i.url).length;

  document.getElementById('photoModal').innerHTML = `
    <div class="photo-modal-backdrop" onclick="handleModalBackdropClick(event)">
      <div class="photo-modal" style="position:relative" onclick="event.stopPropagation()">
        <div class="photo-modal-img-wrap">
          <img src="${img.url}" alt="${escHtml(lastFoodName)} 사진" />
        </div>
        ${total > 1 ? `
          <button class="photo-modal-nav prev" onclick="shiftModal(-1)">&#8249;</button>
          <button class="photo-modal-nav next" onclick="shiftModal(1)">&#8250;</button>
        ` : ''}
        <div class="photo-modal-footer">
          <span class="photo-modal-counter">${modalIndex + 1} / ${currentImages.length}${img.credit ? ' · 📷 ' + escHtml(img.credit) : ''}</span>
          <button class="btn-modal-select ${isSelected ? 'active' : ''}"
            onclick="selectPhoto('${downloadUrl}'); renderModal(); toast('✅ 사진이 선택됐어요!')">
            ${isSelected ? '✅ 선택됨' : '☑️ 선택하기'}
          </button>
          <button class="btn-modal-download" onclick="doDownload('${downloadUrl}')">⬇️ 다운로드</button>
          <button class="btn-modal-close" onclick="closePhotoModal()">✕ 닫기</button>
        </div>
      </div>
    </div>
  `;
}

function shiftModal(dir) {
  const validIdxs = currentImages.map((img, i) => img.url ? i : -1).filter(i => i >= 0);
  const cur = validIdxs.indexOf(modalIndex);
  const next = (cur + dir + validIdxs.length) % validIdxs.length;
  modalIndex = validIdxs[next];
  renderModal();
}

function handleModalBackdropClick(e) {
  if (e.target === e.currentTarget) closePhotoModal();
}

// ESC 키로 모달 닫기
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closePhotoModal();
  if (e.key === 'ArrowLeft')  shiftModal(-1);
  if (e.key === 'ArrowRight') shiftModal(1);
});

function copyText(text, btn) {
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "✅ 복사됨!";
    btn.classList.add('copied');
    toast("복사되었어요! 📋");
    setTimeout(() => {
      btn.textContent = "📋 복사";
      btn.classList.remove('copied');
    }, 2000);
  }).catch(() => {
    // fallback
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent = "✅ 복사됨!"; btn.classList.add('copied');
    toast("복사되었어요! 📋");
    setTimeout(() => { btn.textContent = "📋 복사"; btn.classList.remove('copied'); }, 2000);
  });
}

function renderQuickChips() {
  var el = document.getElementById('quickChips');
  if (!el) return;
  // 검색 기록에 있는 음식 제외하고 섞기
  var pool = ALL_FOODS.filter(function(f) { return searchHistory.indexOf(f.n) < 0; });
  if (pool.length < 8) pool = ALL_FOODS.slice(); // 다 검색했으면 전체 재사용
  // Fisher-Yates 셔플 후 8개 선택
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var tmp = pool[i]; pool[i] = pool[j]; pool[j] = tmp;
  }
  var picks = pool.slice(0, 8);
  el.innerHTML = picks.map(function(f) {
    return '<span class="chip" onclick="quickSearch('' + f.n + '')">'
      + f.e + ' ' + f.n + '</span>';
  }).join('');
}

}
function hideResult()  { document.getElementById('resultArea').style.display = 'none'; }
function hideError()   { const e = document.getElementById('errorBox'); e.style.display='none'; e.innerHTML=''; }
function showError(msg){ const e = document.getElementById('errorBox'); e.innerHTML = msg; e.style.display='block'; }

function updateDbStatus(state) {
  var dot  = document.getElementById('dbDot');
  var text = document.getElementById('dbStatusText');
  if (!dot || !text) return;
  if (state === 'ok')         { dot.className = 'dot ok';  text.textContent = 'DB 연결됨'; }
  else if (state === 'err')   { dot.className = 'dot err'; text.textContent = 'DB 오류'; }
  else if (state === 'connecting') { dot.className = 'dot'; text.textContent = '연결 중…'; }
  else                        { dot.className = 'dot'; text.textContent = '연결 중…'; }
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  // 인라인 onclick에서 안전하게 쓸 수 있도록 특수문자 제거
  return String(s)
    .replace(/\\/g, '')
    .replace(/'/g, '&#39;')
    .replace(/"/g, '&quot;')
    .replace(/\n/g, ' ')
    .replace(/\r/g, '');
}

function toast(msg, d = 2500) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), d);
}

/* ════════════════════════════════════════
   INIT  —  window.onload 사용 (body 하단 스크립트에서 DOMContentLoaded는
            이미 지나간 경우가 있어 콜백이 실행 안 될 수 있음)
════════════════════════════════════════ */
async function appInit() {
  console.log("[INIT] appInit 실행됨, readyState:", document.readyState);
  updateDbStatus("connecting");

  // Gemini 키 로드 (내부에서 updateDbStatus 처리)
  await loadGeminiKey();

  // Pixabay 키 로드 (실패해도 무관)
  try { await loadPixabayKey(); } catch(e) {}

  // 키보드 단축키
  var inp = document.getElementById('searchInput');
  if (inp) {
    inp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') startSearch();
    });
  }

  renderHistory();
  renderQuickChips();
}

// DOMContentLoaded가 이미 지났을 수 있으므로 readyState 확인 후 실행
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', appInit);
} else {
  appInit();
}
</script>
